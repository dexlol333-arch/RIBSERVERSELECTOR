name: Build RibSelector

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then
            echo "No pom.xml in this repo. Files found:"; find . -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "Using $POM"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B package --file "${{ steps.pom.outputs.dir }}/pom.xml"

      - name: Upload RibSelector.jar
        uses: actions/upload-artifact@v4
        with:
          name: RibSelector
          path: ${{ steps.pom.outputs.dir }}/target/RibSelector.jar
